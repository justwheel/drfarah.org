---
###############################################################################
#                                                                             #
#                            WEBSITE CONFIGURATION                            #
#                                                                             #
###############################################################################


# --- base website settings ---
title: Farah Aldali
baseURL: https://drfarah.org/
theme: toph
locale: en-us
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: false
# No blog yet, so category and tag pages would be thin duplicates of the
# homepage. The `categories` front-matter key still drives structural content
# (projects, footer); only the generated term pages are suppressed. Remove this
# line when a blog section lands.
disableKinds: ["taxonomy", "term"]
googleAnalytics: G-Q1CV5SH4T2
caches:
  images:
    dir: :cacheDir/images


# --- security settings ---
security:
  exec:
    allow: ['^dart-sass-embedded$', '^git$', '^go$', '^npx$', '^postcss$', '^asciidoctor$']


# --- markup settings ---
markup:
  asciidocExt:
    preserveTOC: true


# --- privacy settings ---
privacy:
  googleAnalytics:
    anonymizeIP: true
    respectDoNotTrack: true
  x:
    enableDNT: true
  vimeo:
    enableDNT: true
  youtube:
    privacyEnhanced: true


# --- navigation menu ---
menu:
  nav:
    - identifier: home
      name: home
      url: /
      weight: 10
    - identifier: about
      name: about
      url: /about/
      weight: 20


# --- custom settings ---
params:
  biography:
    name: Farah Aldali
    tagline: "Dentist & Skincare Expert from Syria"
    gender: Female
    email: farah.aldali1234@gmail.com
    first_online: 2025
    knows_about: [
      "Arabic",
      "dentistry",
      "Syria"
    ]
  colors:
    # Dusty rose with a deep teal accent: the softer, cooler of the four
    # candidates, and the one Farah picked from the rendered pages.
    light:
      primary: "#A25666"
      secondary: "#FAF0E6"
      accent: "#1F4E4A"
      background: "#FDF8F2"
    dark:
      primary: "#7C4250"
      secondary: "#FAF0E6"
      accent: "#2E4744"
      background: "#121212"
  color_mode: auto
  description: Homepage of Farah Aldali, a dentist and skincare expert from Syria.
  fonts:
    default: Open Sans
    default_weight: ":wght@500"
    title: Quicksand
    title_weight: ":wght@600"
    header: Roboto Slab
    header_weight: ":wght@500"
  images:
    - /img/logo.jpg
  hero:
    shape: circle
  favicon: /favicon.ico
  git_repo: https://github.com/justwheel/drfarah.org
  taxonomy_exclude: ["footer", "projects"]
  hire_me: false
  social:
    instagram: drfarahaldali
    linkedin: in/farah-aldali-2388461a9
    threads: drfarahaldali
  date_format: "02 January 2006"
  legal:
    license:
      name: "CC BY-NC-SA 4.0"
      url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
      title: "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International"


# --- internationalization settings ---
defaultContentLang: en
languages:
  # Explicit weights keep hreflang tags and the language switcher in a
  # stable order; without them the order is build-dependent.
  en:
    label: English
    weight: 1
  ar:
    direction: rtl
    label: عربي
    menu:
      nav:
        - identifier: home
          name: الرئيسية
          url: /
          weight: 10
        - identifier: about
          name: حول
          url: /about/
          weight: 20
    params:
      biography:
        name: فرح الدالي
        tagline: "طبيبة أسنان وخبيرة عناية بالبشرة من سوريا"
      description: "الصفحة الشخصية لفرح الدالي، طبيبة أسنان وخبيرة عناية بالبشرة من سوريا."
    title: فرح الدالي
    weight: 2
